<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Santa Cruz Boardwalk</title>
<!-- Load-order prototype of index.html (tests/perf/LOADING.md). Served from the repo root by load_serve.mjs as
     /index_fast.html; the <base> also makes it work from tests/perf/ on the dev server. Every change has a switch so
     it can be measured alone:
       &early=0     painting picked in the module, after its imports (index.html today); 1: a classic script during parse
       &lqip=0      no inlined placeholder        &preview=960|0   a small painting first, then the sharp one
       &gate=0      rides start at once (today); 1: after the painting is on screen
       &conc=N      rides loading at once (1 = one by one, today)     &order=a,b   ride order
       &visible=0   all rides; 1: only rides on screen (the rest when a resize shows them)
       &vendor=cdn  three.js + gsap from jsDelivr (today, with modulepreload + preconnect); self: vendor/vendor.js
       &maxdpr=N    cap the painting's device pixel ratio (phones)    &decode=1  rides' images decode before onload
       &prefetch=0  no modulepreload of the ride layers when they start
       &titleon=preview  the title plays over the preview instead of after the painting
       &loopfps=N   measurement only: update the layers N times a second (headless software GL is ~120 ms a frame) -->
<base href="../../">
<style>
  :root { --page: #f6f1ea; --card: #fffdf9; --line: #e4dbd0; --ink: #362223; --text: #5d4a47; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--page); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  body { position: relative; }
  .world { position: absolute; left: 0; top: 0; width: 3840px; height: 2560px; transform-origin: 0 0; }
  .world > * { position: absolute; inset: 0; width: 3840px; height: 2560px; display: block; }
  /* The placeholder: a 64 px copy of the painting inlined here (530 bytes), blurred, under the painting. */
  .world > .lqip { background: var(--lqip) 0 0 / 100% 100%; filter: blur(36px); transform: scale(1.03); }
  #painting { color: transparent; }   /* no alt-text flash while it loads */
  .panel { position: absolute; left: 12px; top: 12px; max-width: calc(100% - 24px); display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 12px; background: color-mix(in srgb, var(--card) 90%, transparent); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 2px 10px rgb(54 34 35 / 0.12); }
  .panel[hidden] { display: none; }
  .slot { pointer-events: none; }
  .slot canvas, .slot img { position: absolute; display: block; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  @font-face { font-family: Gaegu; src: url(site/title/fonts/gaegu-700.woff2) format("woff2"); font-weight: 700; font-display: swap; }
  .title { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .title:not([data-shown]) { visibility: hidden; }
  .title canvas { position: absolute; display: block; pointer-events: auto; touch-action: none; }
  .title .note { position: absolute; margin: 0; font: 700 20px/1 Gaegu, "Comic Sans MS", cursive; color: #fff8ec; white-space: nowrap; text-shadow: 0 0.08em 0 rgb(22 74 110 / 0.5); }
  .title .explore { position: absolute; pointer-events: auto; color: transparent; overflow: hidden; border-radius: 3px; outline-offset: 5px; -webkit-tap-highlight-color: transparent; }
  .title .explore:focus-visible { outline: 2px solid #fff8ec; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<script>
// Before any module: the import map (self-hosted vendor file or the CDN) and preloads for the title's modules, so
// the title's whole module graph is fetched in one round trip instead of four.
(() => {
  const q = new URLSearchParams(location.search);
  const self = q.get("vendor") === "self";
  const CDN = "https://cdn.jsdelivr.net/npm/";
  const T3 = `${CDN}three@0.170.0/build/three.module.min.js`;
  const map = self
    ? { three: "./vendor/vendor.js", gsap: "./vendor/vendor.js", [T3]: "./vendor/vendor.js",
        "three/addons/lines/LineSegments2.js": "./vendor/vendor.js", "three/addons/lines/LineSegmentsGeometry.js": "./vendor/vendor.js",
        "three/addons/lines/LineMaterial.js": "./vendor/vendor.js" }
    : { three: T3, "three/addons/": `${CDN}three@0.170.0/examples/jsm/`, gsap: `${CDN}gsap@3.13.0/index.js` };
  const pre = q.get("modulepreload") === "0" ? [] : self ? ["vendor/vendor.js"]
    : [T3, ...["LineSegments2", "LineSegmentsGeometry", "LineMaterial"].map((n) => `${CDN}three@0.170.0/examples/jsm/lines/${n}.js`),
       ...["index", "gsap-core", "CSSPlugin"].map((n) => `${CDN}gsap@3.13.0/${n}.js`)];
  if (q.get("modulepreload") !== "0") pre.push("site/title/title.js", "site/title/glyphs.js");
  document.write(`<script type="importmap">${JSON.stringify({ imports: map })}<\/script>`
    + (self ? "" : `<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>`)
    + pre.map((u) => `<link rel="modulepreload" href="${u}">`).join(""));
})();
</script>
</head>
<body>
<div class="world" id="world">
  <div class="lqip" id="lqip" elementtiming="lqip" style="--lqip: url(data:image/webp;base64,UklGRgoCAABXRUJQVlA4IP4BAABQCwCdASpAACsAPpE+mUglo6KhNVQMALASCWYAsR88fWXL/lrF/zxlmXlwLDSLNFcdcmzQBXgfc5mmTyc1Rq+3bjVkblknNEd4z4glNjNmyaJsvQNOiDiZffiw+ulVQ69YCfAA/vI+P6g95fzxbpmlhhqDOKf8dnYEyYLu8vWeSzY2RGX1fUxhAqN/laTZv468QsfjhAFe1ons4iyA+LQEMdrbNVVSGnCw5Oxhk3Fns3NLUz4zXINaqEmJmOcsUvs4BfEsjfRexRWFp/FF4DulAQIFmt+e8XtPTeQn2bRIsdJ+8s5mzIu+Mh6PMdUpx3irVhI8TLshFygG49vXwXfNhtBG9GihXmH+tfWfvDB3/uhvvSYGVDwBlpY6xg0GfdajnU5X7EkEv4hJ8fPHk30YZ31+P/k2HGW8CcmF7cT/lmxkMyljs72r3i19iX3WtZ2iOFbyEjC3psoCbsWh/0+NObD4WPYMWax2kGR00lg633SUrAdzrXd1fzKC7ix6uTfVuCEpN/htqafQ+7WLqhkTP4tR3Wcop6gCTfArybhlZIvqOExSpQzXJxWp790IoZcI955JhpiddLXolJFaW9yCWLy5ESjuM3+5/dGmNMGFmkm1GBKD+PbtVmAczB0A5D+C+N4tceG93tDhU02MCCSXm0Zax23nnkFWFU6MAAA=)"></div>
  <img id="preview" alt="" hidden elementtiming="preview">
  <img id="painting" alt="The whole Santa Cruz Beach Boardwalk in our style, with the town above and the sea below" fetchpriority="high" elementtiming="painting">
  <div class="slot" data-slot="plate"></div>
  <div class="slot" data-slot="rides"></div>
  <canvas id="animals"></canvas>
  <div class="slot" data-slot="front"></div>
</div>
<script>
// During parse, before any module loads: fit the world to the window and start the painting (the module graph
// used to delay this by three round trips). The module reuses window.__fit.
(() => {
  const q = new URLSearchParams(location.search);
  const W = 3840, H = 2560, WIDTHS = [1920, 2560, 3456, 3840, 5120];
  const world = document.getElementById("world"), painting = document.getElementById("painting");
  const maxdpr = Number(q.get("maxdpr")) || Infinity, early = q.get("early") !== "0";
  if (q.get("lqip") === "0") document.getElementById("lqip").remove();
  const pv = Number(q.get("preview") ?? 0);
  if (pv) { const p = document.getElementById("preview"); p.hidden = false; p.fetchPriority = "high"; p.src = `site/park/world_${pv}.webp`; }
  const F = window.__fit = { W, H, scale: 1, loaded: 0, early };
  F.pick = (s) => {
    const need = W * s * Math.min(devicePixelRatio || 1, maxdpr);
    const w = WIDTHS.find((v) => v >= need * 0.95) ?? WIDTHS.at(-1);
    if (w > F.loaded) { F.loaded = w; painting.src = `site/park/world_${w}.webp`; }
  };
  F.fit = () => {
    F.scale = Math.max(innerWidth / W, innerHeight / H);
    if (F.early || F.module) F.pick(F.scale);
    world.style.transform = `translate(${(innerWidth - W * F.scale) / 2}px, ${(innerHeight - H * F.scale) / 2}px) scale(${F.scale})`;
  };
  F.fit();
})();
</script>
<header class="title" id="title">
  <h1 class="sr">Shiran</h1>
  <canvas aria-hidden="true"></canvas>
  <p class="note">@ santa cruz beach boardwalk</p>
  <a class="explore" href="#explore">Explore</a>
</header>
<div class="panel mono" id="panel" hidden></div>
<script type="module">
// The park page with a load order: painting (placeholder, then sharp) -> title -> rides on screen, a few at a time,
// most wanted first -> the crowd -> rides off screen when a resize shows them. Same mount(ctx) contract as index.html.
import { createCamera } from "./base/camera.js";
import { createClock } from "./base/clock.js";

const RIDES = ["sea", "traffic", "coaster", "wheel", "teacups", "flume", "pirate", "carousel", "thrill"]; // reviewed rides only
// Each ride's box in park px [x0, y0, x1, y1] (from its layer.js / json), to load only what the window shows.
const BOXES = {
  sea: [0, 1187, 3840, 2560], traffic: [0, 440, 3840, 1150], coaster: [1990, 900, 3240, 1262], wheel: [2452, 1176, 2708, 1484],
  teacups: [3080, 1428, 3340, 1650], flume: [3010, 890, 3740, 1400], pirate: [690, 1035, 1180, 1305],
  carousel: [1555, 1095, 2560, 1560], thrill: [895, 725, 1415, 1240],
};
const ORDER = ["sea", "coaster", "wheel", "carousel", "teacups", "pirate", "thrill", "flume", "traffic"];

const F = window.__fit, { W, H } = F;
const world = document.getElementById("world");
const painting = document.getElementById("painting");
const params = new URLSearchParams(location.search);
const flag = (k, d) => (params.has(k) ? params.get(k) !== "0" : d);
const conc = Number(params.get("conc") ?? 3);
const order = params.get("order")?.split(",") ?? ORDER;

// &decode=1: an image a ride loads with new Image() reports onload only once it is decoded off the main thread.
if (flag("decode", false)) {
  const desc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "onload") ?? Object.getOwnPropertyDescriptor(HTMLElement.prototype, "onload");
  Object.defineProperty(HTMLImageElement.prototype, "onload", {
    configurable: true,
    get() { return desc.get.call(this); },
    set(fn) { desc.set.call(this, fn && ((e) => this.decode().catch(() => {}).then(() => fn.call(this, e)))); },
  });
}

F.module = true;
if (!F.early) F.pick(F.scale);
let crowd = null;
const rides = [];
const canvases = [];
const riderBlocks = [], state = {};
let running = 0, started = false, firstWave = null;
function onResize() {
  F.fit();
  crowd?.resize(F.scale);
  for (const e of canvases) e.fit();
  for (const l of rides) l.resize?.(F.scale);
  if (started) schedule();
}
addEventListener("resize", onResize);
const scale = () => F.scale;

// The painting is on screen: its decode resolved (or the preview, for the first look).
const paintingShown = painting.decode().catch(() => {});
const preview = document.getElementById("preview");
paintingShown.then(() => { performance.mark("painting-shown"); preview.remove(); });

// &titleon=preview: the title plays as soon as the preview is on screen, over it, instead of after the painting.
const titleGate = params.get("titleon") === "preview" && preview.getAttribute("src") ? preview.decode().catch(() => {}) : paintingShown;
Promise.all([
  import("./site/title/title.js").then((m) => m.mountTitle(document.getElementById("title"), { params })),
  titleGate,
]).then(([title]) => { title.play(); performance.mark("title-play"); }).catch((err) => console.error("title failed", err));

const slots = Object.fromEntries([...world.querySelectorAll("[data-slot]")].map((el) => [el.dataset.slot, el]));
const park = await fetch("tests/park-crowd/park.json").then((r) => r.json());
const clock = createClock();
const ctx = {
  park, W, H, camera: createCamera(park), clock, params, slots, scale,
  riders: (name, key, t) => crowd?.riders(name, key, t) ?? null,
  addPatch(url, [x, y, w, h]) {
    const img = new Image();
    img.src = url;
    img.alt = "";
    img.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
    slots.plate.append(img);
    return img;
  },
  canvas(slot = "rides", { maxDensity = 1.5 } = {}) {
    const c = document.createElement("canvas");
    c.style.cssText = `left:0;top:0;width:${W}px;height:${H}px`;
    slots[slot].append(c);
    const entry = { c, maxDensity, fit() { const d = F.scale * Math.min(devicePixelRatio || 1, maxDensity / F.scale); c.width = Math.round(W * d); c.height = Math.round(H * d); c.density = d; } };
    entry.fit();
    canvases.push(entry);
    return c;
  },
};

// The frame loop runs from the start, so each ride moves as soon as it is mounted (index.html starts it after the
// last layer, so nothing moves until everything has loaded).
const panel = document.getElementById("panel");
panel.hidden = !params.has("panel");
addEventListener("keydown", (e) => { if (e.key === "h" || e.key === "H") panel.hidden = !panel.hidden; });
let frames = 0, prev = clock.now();
// &loopfps=N (measurement only): update the layers N times a second. Headless Chrome renders WebGL in software
// (~120 ms a frame here), which a real GPU does in a few ms; throttling the loop approximates that for load timings.
const loopEvery = params.has("loopfps") ? 1000 / Number(params.get("loopfps")) : 0;
let lastLoop = -Infinity;
function frame() {
  if (loopEvery && performance.now() - lastLoop < loopEvery) { requestAnimationFrame(frame); return; }
  lastLoop = performance.now();
  const t = clock.now(), dt = Math.min(0.1, Math.max(0, t - prev));
  prev = t;
  crowd?.update();
  for (const l of rides) l.update?.(t, dt);
  if (!panel.hidden && frames++ % 30 === 0) {
    const st = crowd?.stats() ?? {};
    panel.textContent = `window ${innerWidth}×${innerHeight} at ${devicePixelRatio}× · painting ${F.loaded} px · ${JSON.stringify(st)}`;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Rides: which are on screen now (park px of the window, with a margin), in the wanted order, `conc` at a time.
const wanted = params.has("layers") ? params.get("layers").split(",").filter(Boolean) : RIDES;
const queue = [...order.filter((n) => wanted.includes(n)), ...wanted.filter((n) => !order.includes(n))];
const onlyVisible = flag("visible", true);
function visible(name) {
  const b = BOXES[name];
  if (!onlyVisible || !b) return true;
  const s = F.scale, m = 40;
  const x0 = W / 2 - innerWidth / (2 * s) - m, x1 = W / 2 + innerWidth / (2 * s) + m;
  const y0 = H / 2 - innerHeight / (2 * s) - m, y1 = H / 2 + innerHeight / (2 * s) + m;
  return b[0] < x1 && b[2] > x0 && b[1] < y1 && b[3] > y0;
}
async function mountRide(name) {
  // A ride's plate patches (the painting with the ride erased) stay hidden until the ride itself is ready, so the
  // painted ride never disappears before the live one shows (index.html shows each patch as soon as it loads).
  const patches = [];
  let mounting = true;
  const rideCtx = { ...ctx, name, dir: new URL(`./rides/${name}/`, document.baseURI),
    addPatch(url, rect) { const img = ctx.addPatch(url, rect); if (mounting) { img.style.visibility = "hidden"; patches.push(img); } return img; } };
  try {
    const mod = await import(`./rides/${name}/layer.js`);
    const layer = (await mod.mount(rideCtx)) || {};
    mounting = false;
    await Promise.all(patches.map((img) => img.decode().catch(() => {})));
    for (const img of patches) img.style.visibility = "";
    layer.resize?.(F.scale);
    rides.push(layer);
    if (layer.riders) riderBlocks.push({ ...layer.riders, name });
    performance.mark(`alive:${name}`);
  } catch (err) {
    console.error(`ride layer ${name} failed`, err);
  }
}
function schedule() {
  for (const name of queue) {
    if (running >= conc) break;
    if (state[name] || !visible(name)) continue;
    state[name] = "loading";
    running++;
    mountRide(name).then(() => { state[name] = "alive"; running--; schedule(); firstWave?.check(); });
  }
}
// The first wave: every ride on screen at load time; then the crowd.
const firstNames = queue.filter(visible);
const firstDone = new Promise((done) => { firstWave = { check() { if (firstNames.every((n) => state[n] === "alive")) done(); } }; });
if (flag("gate", true)) await paintingShown;
started = true;
// The layers' code is small: fetch every on-screen ride's module now, so the later ones skip a round trip.
if (flag("prefetch", true)) for (const n of firstNames) { const l = document.createElement("link"); l.rel = "modulepreload"; l.href = `rides/${n}/layer.js`; document.head.append(l); }
schedule();
if (!firstNames.length) firstWave.check();
await firstDone;

if (params.get("crowd") !== "0") {
  const { mountCrowd } = await import("./tests/park-crowd/crowd.js");
  crowd = await mountCrowd(document.getElementById("animals"), { params, clock, rides: riderBlocks });
  crowd.resize(F.scale);
  performance.mark("alive:crowd");
}
performance.mark("alive:all");

await paintingShown;
requestAnimationFrame(() => requestAnimationFrame(() => { document.documentElement.dataset.ready = "1"; }));
</script>
</body>
</html>
