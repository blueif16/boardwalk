<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whole Park Preview</title>
<style>
  :root { --page: #f6f1ea; --card: #fffdf9; --line: #e4dbd0; --ink: #362223; --text: #5d4a47; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--page); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  .world { position: absolute; left: 0; top: 0; width: 3840px; height: 2560px; transform-origin: 0 0; }
  .world > * { position: absolute; inset: 0; width: 3840px; height: 2560px; display: block; }
  .panel { position: absolute; left: 12px; bottom: 12px; max-width: calc(100% - 24px); display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 12px; background: color-mix(in srgb, var(--card) 90%, transparent); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 2px 10px rgb(54 34 35 / 0.12); }
  .panel[hidden] { display: none; }
  .panel b { color: var(--ink); }
  .panel button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 3px 10px; cursor: pointer; color: var(--text); }
  .panel button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>
<div class="world" id="world">
  <img src="gen/park/world_v1_0.webp" alt="The whole Santa Cruz Beach Boardwalk in our style, with the town above and the sea below">
  <canvas id="animals" width="3840" height="2560"></canvas>
</div>
<div class="panel" id="panel">
  <b>Animal size</b>
  <span id="sizes"></span>
  <span class="mono" id="readout"></span>
  <span>· H hides this</span>
</div>
<script type="module">
// A fixed, whole-park view: the 3:2 painting always covers the window (no scrolling, no bars) and the park strip in
// its middle stays whole on screens from 3:2 to about 2.4:1. Animals are a static scale preview, not the crowd sim.
const W = 3840, H = 2560;
const UNIT = 3840 / 3904; // world px per stage unit: the park strip is 3904 stage units wide
const world = document.getElementById("world");
const canvas = document.getElementById("animals");
const ctx = canvas.getContext("2d");
const params = new URLSearchParams(location.search);
let px = Number(params.get("px")) || 38;

function fit() {
  const s = Math.max(innerWidth / W, innerHeight / H);
  world.style.transform = `translate(${(innerWidth - W * s) / 2}px, ${(innerHeight - H * s) / 2}px) scale(${s})`;
  const dpr = devicePixelRatio || 1;
  document.getElementById("readout").textContent =
    `window ${innerWidth}×${innerHeight} at ${dpr}× · park ${Math.round(W * s)} px wide · an animal ${(px * UNIT * s).toFixed(1)} px tall (${Math.round(px * UNIT * s * dpr)} screen pixels)`;
}

const [meta, atlas] = await Promise.all([
  fetch("tests/characters/atlas.json").then((r) => r.json()),
  new Promise((done) => { const im = new Image(); im.onload = () => done(im); im.src = "tests/characters/atlas.png"; }),
]);
const LOOKS = ["bear", "bunny", "cat_orange", "dog_shiba", "cat_grey", "bunny_brown", "dog_cream"];
const VIEWS = ["front", "side", "side", "back"];

// Feet points in world px, picked by eye on world_v1_0: promenade spots, the entrance plaza and the beach.
const SPOTS = [
  [550, 1225, 3], [660, 1240, 2], [1000, 1310, 3], [1210, 1300, 2], [1800, 1380, 3], [2010, 1440, 2],
  [2360, 1478, 3], [2520, 1522, 2], [2700, 1590, 2], [3060, 1665, 3], [3300, 1700, 2],
  [600, 1370, 2], [1000, 1470, 4], [1300, 1430, 2], [1500, 1500, 3], [1800, 1600, 3], [2150, 1650, 2],
  [2500, 1690, 4], [2800, 1770, 3], [2000, 1750, 2], [3150, 1880, 2], [1250, 1620, 2],
];
let seed = 7;
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
// Each animal is its spot plus an offset in animal heights, so a group spreads with the size being previewed.
const crowd = SPOTS.flatMap(([x, y, n]) => Array.from({ length: n }, (_, i) => ({
  x, y, ox: (i - (n - 1) / 2) * 0.62 + (rand() - 0.5) * 0.3, oy: (rand() - 0.5) * 0.5,
  look: LOOKS[Math.floor(rand() * LOOKS.length)], view: VIEWS[Math.floor(rand() * VIEWS.length)], flip: rand() < 0.5,
})));

function draw() {
  ctx.clearRect(0, 0, W, H);
  const k = (px / 30) * UNIT / meta.scale; // atlas px -> world px
  const step = px * UNIT;
  const placed = crowd.map((a) => ({ ...a, gx: a.x + a.ox * step, gy: a.y + a.oy * step * 0.3 }));
  const sh = meta.frames.shadow;
  for (const a of placed.sort((p, q) => p.gy - q.gy)) {
    const { gx, gy } = a;
    ctx.globalAlpha = 0.8;
    ctx.drawImage(atlas, sh.rect[0], sh.rect[1], sh.rect[2], sh.rect[3], gx - sh.anchor[0] * k * 0.8, gy - sh.anchor[1] * k * 0.8, sh.rect[2] * k * 0.8, sh.rect[3] * k * 0.8);
    ctx.globalAlpha = 1;
    const f = meta.frames[`${a.look}/${a.view}_stand`];
    if (!f) continue;
    const [sx, sy, sw, shh] = f.rect, [ax, ay] = f.anchor;
    ctx.save();
    ctx.translate(gx, gy);
    if (a.flip && a.view === "side") ctx.scale(-1, 1);
    ctx.drawImage(atlas, sx, sy, sw, shh, -ax * k, -ay * k, sw * k, shh * k);
    ctx.restore();
  }
}

const sizes = document.getElementById("sizes");
for (const v of [30, 38, 47, 60, 70]) {
  const b = document.createElement("button");
  b.textContent = v;
  b.addEventListener("click", () => { px = v; buttons(); draw(); fit(); });
  sizes.append(b);
}
const buttons = () => [...sizes.children].forEach((b) => b.setAttribute("aria-pressed", String(Number(b.textContent) === px)));
addEventListener("keydown", (e) => { if (e.key === "h" || e.key === "H") document.getElementById("panel").hidden ^= true; });
addEventListener("resize", fit);
buttons();
draw();
fit();
document.documentElement.dataset.ready = "1";
</script>
</body>
</html>
